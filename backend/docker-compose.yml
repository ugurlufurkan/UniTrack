version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: unitrack-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: unitrack
    ports:
      - "5432:5432"
    volumes:
      - unitrack_pg_data:/var/lib/postgresql/data

volumes:
  unitrack_pg_data: