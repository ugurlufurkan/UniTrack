name: Quality checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npm run build
        working-directory: backend
      - run: node ops/tests/production.integration.mjs --build
      - run: node --test ops/monitor.test.mjs
      - run: node ops/tests/backup.integration.mjs
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: unitrack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d unitrack_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-password@127.0.0.1:5432/unitrack_test
      - run: npm audit --omit=dev
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
      - run: npm ci && npm run build
        working-directory: backend
      - run: npm ci
        working-directory: web
      - run: npm test && npm run lint && npm run typecheck && npm run format:check && npm run build && npm run test:integration
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - run: npm audit --omit=dev
        working-directory: web
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-test-failure
          path: |
            web/test-results
            web/playwright-report
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: bash gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: android-test-failure
          path: android/app/build/reports
