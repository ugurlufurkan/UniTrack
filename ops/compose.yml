name: unitrack
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: unitrack
      POSTGRES_DB: unitrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random hexadecimal database password}
    volumes: [database:/var/lib/postgresql/data]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unitrack -d unitrack']
      interval: 5s
      retries: 10
  migrate:
    build:
      context: ../backend
      target: migrator
    environment:
      DATABASE_URL: postgresql://unitrack:${POSTGRES_PASSWORD}@db:5432/unitrack
    networks: [data]
    profiles: [tools]
    depends_on:
      db: { condition: service_healthy }
  backend:
    build: ../backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://unitrack:${POSTGRES_PASSWORD}@db:5432/unitrack
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a distinct random refresh secret}
      WEB_PROXY_SECRET: ${WEB_PROXY_SECRET:?Set a shared proxy secret}
      FRONTEND_URL: https://${WEB_DOMAIN:?Set the web domain}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TRUST_PROXY: '1'
      ALLOWED_ORIGINS: https://${WEB_DOMAIN}
      SMTP_HOST: ${SMTP_HOST:?Set the SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?Set the SMTP username}
      SMTP_PASS: ${SMTP_PASS:?Set the SMTP password}
      SMTP_FROM: ${SMTP_FROM:?Set the sender address}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks: [edge, data]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 20s
  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    environment:
      API_URL: http://backend:5000/api/v1
      WEB_PROXY_SECRET: ${WEB_PROXY_SECRET}
      WEB_CLIENT_IP_HEADER: x-forwarded-for
    networks: [edge]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
  ingress:
    image: caddy:2-alpine
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?Set the API domain}
      OPS_EMAIL: ${OPS_EMAIL:?Set the certificate contact email}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [web, backend]
    restart: unless-stopped
networks:
  edge:
  data:
    internal: true
volumes:
  database:
  certificates:
  caddy_config:
