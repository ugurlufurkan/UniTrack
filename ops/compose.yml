name: unitrack
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: unitrack
      POSTGRES_DB: unitrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random hexadecimal database password}
    volumes: [database:/var/lib/postgresql/data]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unitrack -d unitrack']
      interval: 5s
      retries: 10
  migrate:
    build:
      context: ../backend
      target: migrator
    environment:
      DATABASE_URL: postgresql://unitrack:${POSTGRES_PASSWORD}@db:5432/unitrack
    networks: [data]
    profiles: [tools]
    depends_on:
      db: { condition: service_healthy }
  backend:
    build: ../backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://unitrack:${POSTGRES_PASSWORD}@db:5432/unitrack
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a distinct random refresh secret}
      WEB_PROXY_SECRET: ${WEB_PROXY_SECRET:?Set a shared proxy secret}
      FRONTEND_URL: https://${WEB_DOMAIN:?Set the web domain}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TRUST_PROXY: '1'
      ALLOWED_ORIGINS: https://${WEB_DOMAIN}
      SMTP_HOST: ${SMTP_HOST:?Set the SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?Set the SMTP username}
      SMTP_PASS: ${SMTP_PASS:?Set the SMTP password}
      SMTP_FROM: ${SMTP_FROM:?Set the sender address}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: mailto:${OPS_EMAIL}
    networks: [edge, data]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 20s
  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    environment:
      API_URL: http://backend:5000/api/v1
      WEB_PROXY_SECRET: ${WEB_PROXY_SECRET}
      WEB_CLIENT_IP_HEADER: x-forwarded-for
    networks: [edge]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
  push:
    build: ../backend
    command: ['node', 'dist/workers/push.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://unitrack:${POSTGRES_PASSWORD}@db:5432/unitrack
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: mailto:${OPS_EMAIL}
      PUSH_TIMEZONE: ${PUSH_TIMEZONE:-Europe/Istanbul}
    networks: [edge, data]
    profiles: [push]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://backend:5000/api/push-health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 8s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 35s
  ingress:
    image: caddy:2-alpine
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?Set the API domain}
      OPS_EMAIL: ${OPS_EMAIL:?Set the certificate contact email}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [web, backend]
    restart: unless-stopped
  monitor:
    build:
      context: .
      dockerfile: Monitor.Dockerfile
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ENABLE_EXTERNAL_ALERTS: ${ENABLE_EXTERNAL_ALERTS:-false}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
    volumes: [monitor_state:/state, backup_status:/status:ro]
    networks: [edge]
    depends_on: [web, backend]
    read_only: true
    restart: unless-stopped
  backup:
    build:
      context: .
      dockerfile: Backup.Dockerfile
    environment:
      PGHOST: db
      PGUSER: unitrack
      PGDATABASE: unitrack
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
    volumes: [./backups:/backups, backup_status:/status]
    networks: [data]
    profiles: [backup]
    depends_on:
      db: { condition: service_healthy }
    entrypoint: ['/bin/sh', '-ec']
    command: ['while true; do /scripts/backup.sh; sleep 86400; done']
    restart: unless-stopped
  restore-check:
    build:
      context: .
      dockerfile: Backup.Dockerfile
    environment:
      PGHOST: db
      PGUSER: unitrack
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_FILE: ${BACKUP_FILE:-}
    volumes:
      - ./backups:/backups:ro
      - type: bind
        source: ${BACKUP_IDENTITY_FILE:-./keys/backup.agekey}
        target: /run/secrets/backup_identity
        read_only: true
        bind:
          create_host_path: false
    networks: [data]
    profiles: [recovery]
    command: ['/scripts/restore-check.sh']
networks:
  edge:
  data:
    internal: true
volumes:
  database:
  certificates:
  caddy_config:
  monitor_state:
  backup_status:
